<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='recuperacao.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="cartao-glass">
        
        <div class="secao-cabecalho">
            <div class="icone-perfil">
                <i class="fa-solid fa-key"></i> 
            </div>
            <h2>Recuperar Senha</h2>
            <p class="texto-instrucao">Insira seu e-mail cadastrado para receber as instruções de redefinição.</p>
        </div>

        <form action="/recuperacao" method="POST">
            <div class="grupo-entrada">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <button type="submit" class="botao-recuperacao">ENVIAR INSTRUÇÕES</button>
        </form>

        <div class="texto-rodape">
            Lembrou a senha? <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>

</body>
</html>
