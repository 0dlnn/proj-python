<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="cartao-glass">
        <div class="secao-cabecalho">
            <div class="icone-perfil">
                <i class="fa-solid fa-user-plus"></i> 
            </div>
            <h2>Criar Conta</h2>
        </div>

        <form id="formCadastro" action="/cadastro" method="POST">
            
            <div class="grupo-entrada apenas-leitura">
                <i class="fa-solid fa-fingerprint"></i>
                <input type="text" id="idAutomatico" name="num_usuario" readonly title="ID Gerado pelo Sistema">
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="nome" placeholder="Nome Completo" required>
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-address-card"></i>
                <input type="text" 
                       name="cpf" 
                       placeholder="CPF" 
                       maxlength="14" 
                       oninput="mascaraCPF(this)" 
                       required> 
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" name="telefone" placeholder="Telefone" maxlength="20" oninput="mascaraTelefone(this)" required> 
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="senha" placeholder="Senha" maxlength="255" required>
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-shield-halved"></i>
                <input type="password" name="repetir_senha" placeholder="Repetir Senha" maxlength="255" required>
            </div>

            <button type="submit" class="botao-cadastro">FINALIZAR CADASTRO</button>
        </form>

        <div class="texto-rodape">
            Já tem uma conta? <a href="{{ url_for('login') }}">Faça Login</a>
        </div>
    </div>

    <script>
        // Gera um número aleatório de 6 dígitos para o ID do usuário ao carregar a página
        window.onload = function() {
            const randomNum = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('idAutomatico').value = randomNum;
        };

        // === SCRIPT DE INTERCEPTAÇÃO DE TECLADO: COMPLEMENTAÇÃO AUTOMÁTICA DE PONTOS E HÍFEN ===
        document.getElementById('idAutomatico').value = randomNum;
        function mascaraCPF(campo) {
            // 1. Limpa qualquer entrada não numérica enviada para a caixa de texto
            let valor = campo.value.replace(/\D/g, "");
            
            // 2. Aplica o primeiro ponto de separação após a primeira tríade de algarismos
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            
            // 3. Aplica o segundo ponto de separação após a segunda sequência de 3 números
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            
            // 4. Aplica o hífen delimitador antes dos últimos 2 dígitos verificadores do documento
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            
            // 5. cospe a string tratada de volta para renderização dinâmica no navegador
            campo.value = valor;
        }

        // === NOVO: COMPLEMENTAÇÃO AUTOMÁTICA DE PARÊNTESES, ESPAÇO E TRAÇO DO TELEFONE ===
        function mascaraTelefone(input) {
            let valor = input.value.replace(/\D/g, "");
            
            if (valor.length > 0) {
                valor = "(" + valor;
                if (valor.length > 3) {
                    valor = valor.slice(0, 3) + ") " + valor.slice(3);
                }
                if (valor.length > 10) {
                    // Formato para celular: (DD) 9XXXX-XXXX
                    valor = valor.slice(0, 10) + "-" + valor.slice(10, 14);
                } else if (valor.length > 9) {
                    // Formato para fixo: (DD) XXXX-XXXX
                    valor = valor.slice(0, 9) + "-" + valor.slice(9);
                }
            }
            input.value = valor;
        }
    </script>

</body>
</html>
