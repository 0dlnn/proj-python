<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Desbloqueio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='desbloqueio.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="cartao-glass">
        
        <nav class="menu-navegacao">
            <a href="#" class="active">
                <i class="fa-solid fa-unlock-keyhole"></i> DESBLOQUEIO
            </a>
            <a href="{{ url_for('admin_usuarios') }}">
                <i class="fa-solid fa-users-gear"></i> USUÁRIOS
            </a>
            <a href="{{ url_for('login') }}">
                <i class="fa-solid fa-power-off"></i> SAIR
            </a>
        </nav>

        <div class="secao-cabecalho">
            <h2>Central de Desbloqueio</h2>
            <p>Analise de ID com IP para controle e desbloqueio.</p>
        </div>

        <form action="{{ url_for('finalizar_desbloqueio') }}" method="POST" class="formulario-desbloqueio" onsubmit="return validarEnvio()">
            
            <div class="linha-entrada">
                <div class="grupo-entrada campo-id">
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" name="id_usuario" id="id_usuario" placeholder="ID do Usuário" required>
                </div>
                
                <button type="button" class="botao-amarelo-sincronizar" onclick="buscarIP()" title="Sincronizar IP do usuario.">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>

            <div class="grupo-entrada apenas-leitura">
                <i class="fa-solid fa-network-wired"></i>
                <input type="text" name="ip_identificado" id="ip_identificado" placeholder="IP DESCONHECIDO" readonly>
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-bars-staggered"></i>
                <textarea name="motivo" placeholder="Justificativa do acesso/desbloqueio..." rows="4" required></textarea>
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-user-shield"></i>
                <input type="text" 
                       name="responsavel" 
                       id="responsavel" 
                       placeholder="Sigla do Responsável (Ex: ADM, SUP)" 
                       maxlength="10" 
                       required>
            </div>

            <button type="submit" class="botao-azul-finalizar">REALIZAR DESBLOQUEIO</button>
        </form>

        <div class="rodape-status">
            <p>MODO ADMINISTRADOR</p>
        </div>
    </div>

    <script>
    // FUNÇÃO QUE BUSCA O IP NA ROTA PYTHON EM SEGUNDO PLANO
    function buscarIP() {
        const idUsuario = document.getElementById('id_usuario').value.trim();
        const campoIP = document.getElementById('ip_identificado');

        if (!idUsuario) {
            alert("Por favor, digite o ID do Usuário antes de sincronizar!");
            return;
        }

        campoIP.value = "Buscando...";

        fetch('/buscar_ip_bloqueio', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id: idUsuario })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ip) {
                campoIP.value = data.ip;
            } else {
                campoIP.value = "Reconhecendo IP...";
            }
        })
        .catch(error => {
            console.error("Erro na requisição:", error);
            campoIP.value = "ERRO AO CONECTAR";
        });
    }

    // FUNÇÃO DE VALIDAÇÃO ANTES DE ENVIAR O FORMULÁRIO (TRAVA DE SEGURANÇA)
    function validarEnvio() {
        const ipValue = document.getElementById('ip_identificado').value.trim();
        
        // Se o Admin tentar enviar sem sincronizar ou se o IP for inválido/desconhecido, barra o envio
        if (ipValue === "" || ipValue === "IP DESCONHECIDO" || ipValue === "Buscando..." || ipValue === "ERRO AO CONECTAR") {
            alert("Atenção: Não é possível liberar um acesso sem um IP de rastreio válido. Sincronize o ID primeiro!");
            return false; // Cancela o envio do formulário
        }
        return true; // Permite o envio
    }
    </script>

</body>
</html>
